name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Verify release contents
        run: npm run verify

      - name: Check release version
        run: npm run release:check --workspace @jarl_okbe/tk
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - name: Publish with npm trusted publishing
        run: npm publish --workspace @jarl_okbe/tk --access public

      - name: Verify registry release
        run: |
          version="$(node -p "require('./packages/tk/package.json').version")"
          for attempt in {1..12}; do
            published="$(npm view @jarl_okbe/tk@"$version" version 2>/dev/null || true)"
            if [ "$published" = "$version" ]; then
              actual="$(npx --yes --package "@jarl_okbe/tk@$version" tk --version)"
              test "$actual" = "$version"
              exit 0
            fi
            sleep 10
          done
          echo "@jarl_okbe/tk@$version did not become visible in the registry" >&2
          exit 1

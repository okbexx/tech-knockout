<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Technical Knockout</title>
  <desc id="desc">An evidence-first architecture reference system that helps coding agents decide what to adopt, reuse, or rebuild.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151C27"/>
      <stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#263244" stroke-width="1" opacity=".36"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#080C12"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <path d="M0 14Q0 0 14 0H1186Q1200 0 1200 14V74H0Z" fill="#0E141E"/>
  <circle cx="36" cy="37" r="6" fill="#F26B5B"/>
  <circle cx="58" cy="37" r="6" fill="#E7B84B"/>
  <circle cx="80" cy="37" r="6" fill="#54C58A"/>
  <text x="108" y="44" fill="#8491A6" font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">TK / EVIDENCE → DECISION → BOUNDARY</text>
  <text x="1116" y="44" text-anchor="end" fill="#54C58A" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">READY</text>

  <g transform="translate(58 112)">
    <text x="0" y="0" fill="#54C58A" font-size="18" font-weight="700" letter-spacing="2.8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">AGENT-NATIVE ARCHITECTURE REFERENCE</text>
    <text x="0" y="68" fill="#F4F7FB" font-size="58" font-weight="760" letter-spacing="-1.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Technical</text>
    <text x="0" y="129" fill="#F4F7FB" font-size="58" font-weight="760" letter-spacing="-1.5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Knockout</text>
    <rect x="0" y="154" width="72" height="5" rx="2.5" fill="#54C58A"/>
    <text x="0" y="199" fill="#B9C2D0" font-size="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">让 Coding Agent 先看真实证据，再决定</text>
    <text x="0" y="233" fill="#B9C2D0" font-size="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">采用、复用，还是复刻最小能力内核。</text>
  </g>

  <g transform="translate(704 104)">
    <rect width="438" height="258" rx="20" fill="url(#panel)" stroke="#334158"/>
    <text x="28" y="39" fill="#8491A6" font-size="17" letter-spacing="1.8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DECISION CONTRACT</text>

    <g transform="translate(28 65)">
      <rect width="112" height="54" rx="10" fill="#14261F" stroke="#2B7452"/>
      <text x="56" y="23" text-anchor="middle" fill="#8CE4B3" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EVIDENCE</text>
      <text x="56" y="42" text-anchor="middle" fill="#6F9F85" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">source + report</text>
    </g>
    <path d="M146 92H184" stroke="#627089" stroke-width="2"/>
    <path d="M177 86L184 92L177 98" fill="none" stroke="#627089" stroke-width="2"/>
    <g transform="translate(190 65)">
      <rect width="100" height="54" rx="10" fill="#172131" stroke="#3F5879"/>
      <text x="50" y="23" text-anchor="middle" fill="#A8C5EF" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">DECIDE</text>
      <text x="50" y="42" text-anchor="middle" fill="#728AA8" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">build vs buy</text>
    </g>
    <path d="M296 92H334" stroke="#627089" stroke-width="2"/>
    <path d="M327 86L334 92L327 98" fill="none" stroke="#627089" stroke-width="2"/>
    <g transform="translate(340 65)">
      <rect width="70" height="54" rx="10" fill="#2A2015" stroke="#80602E"/>
      <text x="35" y="23" text-anchor="middle" fill="#F0C56E" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ACT</text>
      <text x="35" y="42" text-anchor="middle" fill="#9E8250" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">verify</text>
    </g>

    <g transform="translate(28 151)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="0" y="0" fill="#59677C" font-size="15">01</text>
      <text x="38" y="0" fill="#D5DCE7" font-size="17">what to keep</text>
      <text x="220" y="0" fill="#54C58A" font-size="17">MUST KEEP</text>
      <text x="0" y="31" fill="#59677C" font-size="15">02</text>
      <text x="38" y="31" fill="#D5DCE7" font-size="17">what to change</text>
      <text x="220" y="31" fill="#A8C5EF" font-size="17">CAN ADAPT</text>
      <text x="0" y="62" fill="#59677C" font-size="15">03</text>
      <text x="38" y="62" fill="#D5DCE7" font-size="17">where to stop</text>
      <text x="220" y="62" fill="#F0C56E" font-size="17">BOUNDARY</text>
    </g>
  </g>
</svg>

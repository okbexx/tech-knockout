<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Technical Knockout evidence workflow</title>
  <desc id="desc">The agent checks the current project, reads curated TK evidence, defines a capability boundary, and verifies the result.</desc>
  <rect width="1200" height="280" rx="24" fill="#0B1017"/>
  <path d="M86 140H1114" stroke="#263348" stroke-width="3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g transform="translate(54 52)">
      <rect width="250" height="176" rx="18" fill="#111924" stroke="#34435A"/>
      <text x="24" y="34" fill="#66748A" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01 / CURRENT PROJECT</text>
      <text x="24" y="80" fill="#F3F6FA" font-size="25" font-weight="700">先检查当前项目</text>
      <text x="24" y="116" fill="#AAB4C4" font-size="18">已有代码 · 平台能力</text>
      <text x="24" y="145" fill="#AAB4C4" font-size="18">已安装依赖 · 真实约束</text>
    </g>
    <circle cx="329" cy="140" r="14" fill="#54C58A"/>
    <path d="M325 133L333 140L325 147" fill="none" stroke="#07100B" stroke-width="3"/>

    <g transform="translate(354 52)">
      <rect width="250" height="176" rx="18" fill="#111924" stroke="#34435A"/>
      <text x="24" y="34" fill="#66748A" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02 / TK EVIDENCE</text>
      <text x="24" y="80" fill="#F3F6FA" font-size="25" font-weight="700">读取精选证据</text>
      <text x="24" y="116" fill="#AAB4C4" font-size="18">报告 · 横评 · 依赖</text>
      <text x="24" y="145" fill="#AAB4C4" font-size="18">源码缓存 · 新鲜度</text>
    </g>
    <circle cx="629" cy="140" r="14" fill="#7EA7E0"/>
    <path d="M625 133L633 140L625 147" fill="none" stroke="#0B111A" stroke-width="3"/>

    <g transform="translate(654 52)">
      <rect width="250" height="176" rx="18" fill="#111924" stroke="#34435A"/>
      <text x="24" y="34" fill="#66748A" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">03 / BOUNDARY</text>
      <text x="24" y="80" fill="#F3F6FA" font-size="25" font-weight="700">形成实现边界</text>
      <text x="24" y="116" fill="#AAB4C4" font-size="18">Must keep · Can adapt</text>
      <text x="24" y="145" fill="#AAB4C4" font-size="18">Do not copy · First cut</text>
    </g>
    <circle cx="929" cy="140" r="14" fill="#E7B84B"/>
    <path d="M925 133L933 140L925 147" fill="none" stroke="#171005" stroke-width="3"/>

    <g transform="translate(954 52)">
      <rect width="192" height="176" rx="18" fill="#14221C" stroke="#367356"/>
      <text x="24" y="34" fill="#6A9E82" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">04 / VERIFY</text>
      <text x="24" y="80" fill="#F3F6FA" font-size="25" font-weight="700">验证再交付</text>
      <text x="24" y="116" fill="#A9CABA" font-size="18">plan · trace</text>
      <text x="24" y="145" fill="#A9CABA" font-size="18">verification</text>
    </g>
  </g>
</svg>
